<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霸菱素材產生器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===== Reset & Base ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#eef0f5;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ===== Toolbar ===== */
.toolbar{background:#1a2a52;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.toolbar-title{color:#e8c275;font-size:17px;font-weight:700;letter-spacing:2px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(255,255,255,.75)}
.dot{width:8px;height:8px;border-radius:50%;background:#888;transition:background .3s}
.dot.loading{background:#f5a623;animation:pulse 1s infinite}
.dot.ok{background:#4caf50}
.dot.err{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== Layout ===== */
.page{max-width:1400px;margin:0 auto;padding:20px 20px 40px;
  display:grid;
  grid-template-columns:380px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:"tpl preview" "controls preview";
  column-gap:24px;row-gap:0;align-items:start}
.tpl-section{grid-area:tpl;width:380px}
.controls{grid-area:controls;width:380px}
.preview-col{grid-area:preview;position:sticky;top:76px}

/* ===== Section title ===== */
.sec-title{font-size:11px;font-weight:700;color:#6b7280;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}

/* ===== Step 1: 版型選擇 ===== */
.tpl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tpl-btn{padding:14px 12px;border-radius:14px;border:2px solid transparent;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Noto Sans TC',sans-serif;text-align:center;letter-spacing:1px;position:relative;overflow:hidden}
.tpl-btn[data-tpl="dawn"]{background:linear-gradient(135deg,#a8c0e8 0%,#f5d8c2 100%);color:#2a3556}
.tpl-btn[data-tpl="dawn"].active{background:linear-gradient(135deg,#1a2a52 0%,#3a4f8e 50%,#a85a4a 100%);color:#fff;box-shadow:0 6px 18px rgba(26,42,82,.35),inset 0 0 0 2px #e8c275}
.tpl-btn[data-tpl="starlight"]{background:linear-gradient(135deg,#1a3a8f 0%,#0d1b4b 100%);color:#e8c275}
.tpl-btn[data-tpl="starlight"].active{background:linear-gradient(135deg,#0d1b4b 0%,#1a3a8f 100%);color:#e8c275;box-shadow:0 6px 18px rgba(13,27,75,.4),inset 0 0 0 2px #e8c275}
.tpl-btn[data-tpl="rosemist"]{background:linear-gradient(135deg,#f5e6e1 0%,#f0d8d2 100%);color:#c98476}
.tpl-btn[data-tpl="rosemist"].active{background:linear-gradient(135deg,#c98476 0%,#e6b2a8 100%);color:#fff;box-shadow:0 6px 18px rgba(201,132,118,.35),inset 0 0 0 2px #e8c275}
.tpl-btn[data-tpl="coming2"]{background:linear-gradient(135deg,#fce4ec,#f8bbd0);color:#ad1457}
.tpl-btn[data-tpl="coming3"]{background:linear-gradient(135deg,#eceff1,#cfd8dc);color:#37474f}
.tpl-btn.coming{opacity:.55;cursor:not-allowed}
.tpl-btn:not(.coming):not(.active):hover{transform:translateY(-1px);filter:brightness(1.05)}
.tpl-badge{display:inline-block;font-size:10px;background:#e8c275;color:#1a2a52;border-radius:20px;padding:1px 7px;margin-left:4px}
.tpl-badge{display:inline-block;font-size:10px;background:#e8c275;color:#1a2a52;border-radius:20px;padding:1px 7px;margin-left:4px}

/* ===== Step 2: 資料確認 ===== */
.data-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.data-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0}
.data-row:last-child{border-bottom:none}
.data-label{font-size:13px;color:#6b7280}
.data-input{border:1.5px solid #d1d5db;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700;color:#1a2a52;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;text-align:right}
.data-input:focus{border-color:#1a2a52}
.data-sub{font-size:11px;color:#9ca3af;margin-top:3px;text-align:right}
/* 銀行基金資訊表：費率欄位 */
.rate-subhead{font-size:11px;font-weight:700;color:#1a2a52;letter-spacing:1px;background:#f8f9ff;margin:8px -16px 4px;padding:5px 16px;border-left:3px solid #1a2a52}
.rate-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5}
.rate-row:last-child{border-bottom:none}
.rate-code{font-size:11px;font-weight:700;color:#1a2a52;background:#eef1f8;border-radius:4px;padding:2px 6px;margin-right:6px;flex-shrink:0;font-family:'Noto Sans TC',sans-serif}
.rate-label{font-size:12px;color:#6b7280;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate-input{border:1.5px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:13px;font-weight:700;color:#1a2a52;font-family:'Noto Sans TC',sans-serif;outline:none;width:64px;text-align:right;flex-shrink:0}
.rate-input:focus{border-color:#1a2a52}
.rate-pct{font-size:12px;color:#6b7280;margin-left:2px;flex-shrink:0}

/* ===== Buttons ===== */
.btn-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:linear-gradient(135deg,#1a2a52,#2a3f6e);color:#fff;box-shadow:0 4px 12px rgba(26,42,82,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(26,42,82,.4)}
.btn-dl{background:#e8c275;color:#1a2a52}
.btn-dl:hover{background:#d4a83a}
.btn-line{background:#06c755;color:#fff}
.btn-line:hover{background:#05a847}
.btn-copy{background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb}
.btn-copy:hover{background:#e5e7eb}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ===== Preview ===== */
.preview-wrap{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.preview-label{font-size:11px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;text-align:center;align-self:stretch}
.poster-scale{transform-origin:top center;transition:transform .15s}

/* ===== LINE Message ===== */
.msg-box{background:#f8faff;border:1px solid #e0e7ff;border-radius:12px;padding:14px;font-size:13px;line-height:1.75;color:#374151;white-space:pre-wrap;margin-bottom:10px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2a52;color:#fff;padding:11px 22px;border-radius:100px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

/* ===== Poster ===== */
#poster{width:1024px;height:1024px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 10px 40px rgba(0,0,0,.2)}

/* RWD */
@media(max-width:900px){
  .page{display:flex;flex-direction:column;padding:16px}
  .tpl-section{width:100%;order:1}
  .preview-col{width:100%;position:static;order:2}
  .controls{width:100%;order:3}
}
@media(max-width:640px){
  .btn-row{flex-direction:column}
  .btn{min-width:0}
}

/* ===== Material Type Tabs ===== */
.material-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mat-tab{flex:1;padding:11px 10px;border-radius:12px;border:2px solid #e5e7eb;background:#fff;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .2s;font-family:'Noto Sans TC',sans-serif;text-align:center}
.mat-tab.active{background:#1a2a52;color:#e8c275;border-color:#1a2a52;box-shadow:0 4px 14px rgba(26,42,82,.25)}
.mat-tab:hover:not(.active){border-color:#9ca3af;color:#374151}
.mat-tab-icon{font-size:18px;display:block;margin-bottom:3px}
.mat-tab-name{font-size:12px;display:block;letter-spacing:.5px}

/* ===== WIP Poster ===== */
#poster-wip{width:1024px;height:1024px;background:linear-gradient(135deg,#1a2a52 0%,#2a3f6e 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;flex-shrink:0}
.wip-icon{font-size:80px;filter:drop-shadow(0 4px 16px rgba(232,194,117,.4))}
.wip-title{color:#e8c275;font-size:36px;font-weight:700;font-family:'Noto Serif TC',serif;letter-spacing:4px}
.wip-sub{color:rgba(232,194,117,.55);font-size:16px;letter-spacing:3px;font-family:'Noto Sans TC',sans-serif}
.wip-badge{background:rgba(232,194,117,.12);border:1px solid rgba(232,194,117,.3);color:rgba(232,194,117,.8);padding:9px 24px;border-radius:100px;font-size:13px;font-family:'Noto Sans TC',sans-serif;letter-spacing:2px;margin-top:8px}


</style>
<style id="posterStyle">/* 素材版型 CSS（載入後動態注入）*/</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">霸菱素材產生器</div>
  <div class="status">
    <div class="dot loading" id="dot"></div>
    <span id="statusTxt">載入中…</span>
  </div>
</div>

<div class="page">

  <div class="tpl-section">
    <div class="sec-title">① 素材類型</div>
    <div id="materialSelect"></div>
    <div class="sec-title" id="secTpl">② 版型選擇</div>
    <div class="tpl-row" id="tplGrid"></div>
  </div>

  <div class="controls">
    <div class="sec-title" id="secFields">③ 資料填寫</div>
    <div id="fieldsContainer"></div>
    <div class="sec-title">④ 產出與發送</div>
    <div class="btn-row">
      <button class="btn btn-dl" id="btnDl" onclick="downloadJPG()" disabled>⬇️ 下載 JPG</button>
      <button class="btn btn-line" onclick="openLINE()">💬 開啟 LINE</button>
    </div>
    <div id="msgSection"></div>
  </div>

  <div class="preview-col">
    <div class="preview-wrap">
      <div class="preview-label">PREVIEW — 1024 × 1024 px</div>
      <div id="scaleWrap" class="poster-scale">
        <!-- 素材 HTML 於切換時動態注入 -->
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 常數
// ============================================================
const SCRIPT = 'https://script.google.com/macros/s/AKfycbwHPWC-nRzKg9qweaYAuhY6S9OKBDcbs5n4MeVWBEbO2IBzedm0la-xaiTtID2KVhOiWw/exec';

// ============================================================
// 狀態
// ============================================================
let APP      = { material: 'dividend', template: 'dawn' };
let MANIFEST = {};
let MOD      = null;   // 目前載入的素材模組

// ============================================================
// 載入 manifest.json
// ============================================================
async function loadManifest() {
  const r = await fetch('./manifest.json');
  MANIFEST = (await r.json()).materials;
}

// ============================================================
// 載入素材模組（動態 import）
// ============================================================
async function loadMaterial(key) {
  MOD = await import(`./materials/${key}.js`);

  // 注入版型 CSS
  document.getElementById('posterStyle').textContent = MOD.CSS;

  // 注入版型 HTML
  document.getElementById('scaleWrap').innerHTML = MOD.HTML;
}

// ============================================================
// 渲染素材類型 Tabs
// ============================================================
function renderMaterialTabs() {
  const el = document.getElementById('materialSelect');
  el.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'material-tabs';
  Object.entries(MANIFEST).forEach(([key, m]) => {
    const btn = document.createElement('button');
    btn.className = 'mat-tab' + (APP.material === key ? ' active' : '');
    btn.innerHTML = `<span class="mat-tab-icon">${m.icon}</span><span class="mat-tab-name">${m.name}</span>`;
    btn.onclick = () => onMaterialChange(key);
    wrap.appendChild(btn);
  });
  el.appendChild(wrap);
}

// ============================================================
// 渲染版型按鈕
// ============================================================
function renderTemplateButtons() {
  const grid = document.getElementById('tplGrid');
  grid.innerHTML = '';
  const m = MANIFEST[APP.material];
  if (!m) return;
  m.templates.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tpl-btn'
      + (APP.template === t.key ? ' active' : '')
      + (!t.available ? ' coming' : '');
    btn.dataset.tpl = t.key;
    btn.disabled = !t.available;
    btn.textContent = t.label;
    if (t.available) btn.onclick = () => selectTpl(t.key);
    grid.appendChild(btn);
  });
  document.getElementById('secTpl').style.display =
    m.templates.every(t => !t.available) ? 'none' : '';
}

// ============================================================
// 切換素材類型
// ============================================================
async function onMaterialChange(key) {
  APP.material = key;
  APP.template = MANIFEST[key].defaultTpl;
  setStatus('loading', '切換中…');

  await loadMaterial(key);

  renderMaterialTabs();
  renderTemplateButtons();
  MOD.renderFields(document.getElementById('fieldsContainer'));
  MOD.renderMsg(document.getElementById('msgSection'));
  MOD.showPoster(APP.template);
  scalePoster();

  if (MANIFEST[key].autoFetch) {
    await init();
  } else {
    setStatus('ok', '請填入資料');
    document.getElementById('btnDl').disabled = true;
    if (key === 'bankTable') await onChannelChange('富邦');
  }
}

// ============================================================
// 切換版型
// ============================================================
function selectTpl(tplKey) {
  APP.template = tplKey;
  document.querySelectorAll('.tpl-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tpl === tplKey));
  requestAnimationFrame(() => {
    if (MOD) MOD.showPoster(tplKey);
    scalePoster();
    updatePoster();
  });
}

// ============================================================
// 全域 hook：updatePoster（被表單 oninput 呼叫）
// ============================================================
function updatePoster() {
  if (MOD) MOD.update();
}

// ============================================================
// 全域 hook：onChannelChange（銀行基金 channel 切換）
// ============================================================
async function onChannelChange(channel) {
  if (MOD && MOD.onChannelChange) {
    setStatus('loading', '費率載入中…');
    try {
      await MOD.onChannelChange(channel, SCRIPT);
      setStatus('ok', '費率已更新');
      document.getElementById('btnDl').disabled = false;
    } catch(e) {
      setStatus('err', '費率載入失敗，請手動填入');
    }
  }
}

// ============================================================
// 自動 fetch API（配息提醒用）
// ============================================================
async function init() {
  setStatus('loading', '資料載入中…');
  document.getElementById('btnDl').disabled = true;
  try {
    await MOD.fetchData(SCRIPT);
    setStatus('ok', '資料已更新');
    document.getElementById('btnDl').disabled = false;
  } catch(e) {
    setStatus('err', '載入失敗，請手動填入');
  }
}

// ============================================================
// 下載 JPG
// ============================================================
async function downloadJPG() {
  if (!MOD) return;
  const btn = document.getElementById('btnDl');
  btn.disabled = true; btn.textContent = '⏳ 產圖中…';
  try {
    await document.fonts.ready;
    const posterEl = MOD.getActivePosterEl(APP.template);
    if (!posterEl) { toast('⚠️ 版型開發中，尚無法下載'); return; }
    const c = await html2canvas(posterEl, {
      width:1024, height:1024, scale:3, useCORS:true, allowTaint:true,
      backgroundColor:null, logging:false,
      onclone: (doc) => MOD.onDownloadClone(doc, APP.template),
    });
    const out = document.createElement('canvas');
    out.width = 1080; out.height = 1080;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(c, 0, 0, 1080, 1080);
    const a = document.createElement('a');
    a.download = MOD.getDownloadFileName(APP);
    a.href = out.toDataURL('image/jpeg', 0.95);
    a.click();
    toast('✅ JPG 已下載');
  } catch(e) { toast('❌ 產圖失敗'); }
  btn.disabled = false; btn.innerHTML = '⬇️ 下載 JPG';
}

// ============================================================
// 複製文字 / 開啟 LINE
// ============================================================
async function copyMsg() {
  const mb = document.getElementById('msgBox');
  if (!mb) return;
  try {
    await navigator.clipboard.writeText(mb.textContent);
    toast('✅ 文字已複製');
  } catch(e) { toast('❌ 複製失敗'); }
}

function openLINE() { window.open('https://line.me/R/', '_blank'); }

// ============================================================
// 工具函式
// ============================================================
function setStatus(t, txt) {
  document.getElementById('dot').className = 'dot ' + t;
  document.getElementById('statusTxt').textContent = txt;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function scalePoster() {
  const area = document.querySelector('.preview-wrap');
  if (!area) return;
  const w = area.clientWidth - 40;
  const s = Math.min(1, w / 1024);
  const wrap = document.getElementById('scaleWrap');
  if (!wrap) return;
  wrap.style.transform = `scale(${s})`;
  wrap.style.marginBottom = `${(1024 * s) - 1024}px`;
}

// ============================================================
// 啟動
// ============================================================
async function bootstrap() {
  await loadManifest();
  await loadMaterial('dividend');
  renderMaterialTabs();
  renderTemplateButtons();
  MOD.renderFields(document.getElementById('fieldsContainer'));
  MOD.renderMsg(document.getElementById('msgSection'));
  MOD.showPoster(APP.template);
  scalePoster();
  await init();
}

window.addEventListener('resize', scalePoster);
window.addEventListener('load', bootstrap);
</script>
</body>
</html>
